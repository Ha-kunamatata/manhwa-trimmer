name: test

on:
  push:
    branches: [main]
  pull_request:

# 이 워크플로는 읽기만 하면 된다. 기본값에 기대지 않고 못박아 둔다 — 이 계정에는
# 업무용 저장소가 함께 있고, 취미 프로젝트의 자동화가 가진 권한은 좁을수록 좋다.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Unit tests
        run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      # before the browser tests, not after: one of them loads the built file,
      # and with nothing on disk it skips itself and reports success
      - name: Single-file build
        run: npm run build
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
